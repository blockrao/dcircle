name: Sync package lock for Cloudflare adapter

on:
  push:
    branches:
      - seo/technical-foundation
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/sync-package-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: "!contains(github.event.head_commit.message, '[lock-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/technical-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock [lock-sync]"
          git push
