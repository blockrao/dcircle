name: Place fact history PostgreSQL regression

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261030040000_create_place_fact_history.sql"
      - "supabase/tests/place-fact-history.sql"
      - "supabase/tests/place-fact-history-fixture.sql"
      - ".github/workflows/place-fact-history-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-regression:
    name: Run migration and rollback-only regression test on isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dcircle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dcircle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create isolated minimal schema fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dcircle_test \
            -f supabase/tests/place-fact-history-fixture.sql

      - name: Apply place fact history migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dcircle_test \
            -f supabase/migrations/20261030040000_create_place_fact_history.sql

      - name: Run rollback-only insert/update/delete and access-control regression
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dcircle_test \
            -f supabase/tests/place-fact-history.sql
