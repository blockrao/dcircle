name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "seo/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check route-verifier syntax
        run: node --check scripts/verify-live-routes.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
