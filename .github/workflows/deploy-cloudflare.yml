name: Cloudflare Worker build (tokenless)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Cloudflare Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify build-time Supabase configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Build Cloudflare Worker bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cf:build

      - name: Explain deployment ownership
        run: |
          echo "Build validation passed. Production deployment is intentionally handled by Cloudflare Workers Builds Git integration."
          echo "No Cloudflare API token is required in GitHub Actions."
          echo "Ensure Cloudflare Workers Builds is connected to this repository's main branch and configured with the required build-time Supabase variables."
