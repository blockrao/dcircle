name: Place slug history regression

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*preserve_canonical_place_slug_history.sql"
      - "supabase/tests/place-slug-history.sql"
      - ".github/workflows/place-slug-history-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: place-slug-history-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regression:
    name: PostgreSQL migration and rollback regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dcircle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dcircle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create minimal Supabase-compatible schema and roles
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dcircle_test <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE TABLE public.places (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            slug text NOT NULL UNIQUE,
            name text NOT NULL,
            publication_status text NOT NULL DEFAULT 'draft',
            published_at timestamptz
          );
          GRANT SELECT ON public.places TO anon, authenticated;
          INSERT INTO public.places (slug, name, publication_status, published_at)
          VALUES (
            'serious-pizza-deep-ellum',
            'Serious Pizza',
            'published',
            now()
          );
          SQL

      - name: Apply slug-history migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dcircle_test \
            -f supabase/migrations/20261030050000_preserve_canonical_place_slug_history.sql

      - name: Run transactional slug-history regression
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dcircle_test \
            -f supabase/tests/place-slug-history.sql

      - name: Verify regression transaction left fixture unchanged
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dcircle_test <<'SQL'
          DO $verify$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.places
              WHERE slug = 'serious-pizza-deep-ellum'
                AND publication_status = 'published'
            ) THEN
              RAISE EXCEPTION 'Regression transaction did not roll back the fixture';
            END IF;

            IF EXISTS (SELECT 1 FROM public.place_slug_history) THEN
              RAISE EXCEPTION 'Regression transaction left historical aliases behind';
            END IF;
          END;
          $verify$;
          SQL
